[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "incubrix-long-tail-connectors"
version = "0.1.0"
description = "Configuration-driven long-tail publishing connector service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
