key: signed_webhook
version: 1.0.0
tier: protocol
auth: api_key
surfaces: [{key: endpoint, content_types: [text, image, video_link], spec: {title_max_chars: 10000, body_max_chars: 100000, links_allowed: true}}]
rate_limits: {per_connection: {requests: 60, per_seconds: 60}}
capabilities: [publish, status, delete]
error_map: {'429': PLATFORM_RATE_LIMIT, '422': PLATFORM_CONTENT_REJECTED, '401': CONNECTION_AUTH_EXPIRED}
instance_param: endpoint_url
